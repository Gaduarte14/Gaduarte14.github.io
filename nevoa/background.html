<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Background - Paredes, Luz e Névoa</title>
</head>
<body>
  <script type="module">
    import OBR, {
      buildCurve,
      buildPath,
      buildShape,
      Command
    } from "https://esm.sh/@owlbear-rodeo/sdk@1.3.0";

    const ID_EXT = "com.gaduarte14.nevoa3em1";
    const CHAVE_PAREDES = `${ID_EXT}/paredes`;
    const CHAVE_CONFIG = `${ID_EXT}/config`;
    const CHAVE_TRACO_BRUTO = `${ID_EXT}/tracoBruto`;
    const CHAVE_LUZ_SOLTA = `${ID_EXT}/luzSolta`;
    const CHAVE_TOKEN_CFG = `${ID_EXT}/tokenCfg`;
    const CHAVE_TOKEN_MEM = `${ID_EXT}/memoria`;

    const ID_TRACO_ARRASTO = `${ID_EXT}_arrasto_ativo`;
    const ID_PONTO1_RETA = `${ID_EXT}_ponto1_reta`;
    const PREFIXO_PREVIA = `${ID_EXT}_previa_`;
    const PREFIXO_PAREDE_GM = `${ID_EXT}_parede_gm_`;
    const PREFIXO_RENDER_LUZ = `${ID_EXT}_luz_render_`;
    const PREFIXO_MARCADOR_LUZ = `${ID_EXT}_luz_gm_`;
    const ID_NEVOA_EXPLORADA = `${ID_EXT}_nevoa_explorada`;
    const ID_NEVOA_ESCURIDAO = `${ID_EXT}_nevoa_escuridao`;

    const CONFIG_PADRAO = {
      toleranciaRDP: 12,
      toleranciaAnguloGraus: 8,
      aceitarDiagonais45: true,
      alinharAoGrid: false,
      passoGridMeiaCelula: true,
      raioSnap: 25,
      comprimentoMinimoSegmento: 14,
      modoLinhaReta: false,
      autoConcluir: false,
      mostrarParedesMestre: true,
      falloffPadrao: 0.5,
      corLuzPadrao: "#ffe8b6",
      passosGradienteLuz: 14,
      nevoaAtiva: true,
      corNevoaExplorada: "#181822",
      opacidadeNevoaExplorada: 0.75,
      modoVisaoMestre: "TUDO",
      revelarTudo: false
    };

    const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

    function projetarNoSeg(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const c2 = dx * dx + dy * dy;
      if (c2 === 0) return { x: a.x, y: a.y, t: 0, dist: dist(p, a) };
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / c2));
      const proj = { x: a.x + t * dx, y: a.y + t * dy };
      return { ...proj, t, dist: dist(p, proj) };
    }

    function simplificarRDP(pts, tol = 12) {
      if (pts.length <= 2) return pts.slice();
      let maxD = 0, idx = 0;
      const a = pts[0], b = pts[pts.length - 1];
      const dx = b.x - a.x, dy = b.y - a.y, c2 = dx * dx + dy * dy;
      for (let i = 1; i < pts.length - 1; i++) {
        const d = c2 === 0 ? dist(pts[i], a) : Math.abs(dy * pts[i].x - dx * pts[i].y + b.x * a.y - b.y * a.x) / Math.sqrt(c2);
        if (d > maxD) { maxD = d; idx = i; }
      }
      if (maxD > tol) {
        return simplificarRDP(pts.slice(0, idx + 1), tol).slice(0, -1).concat(simplificarRDP(pts.slice(idx), tol));
      }
      return [{ x: a.x, y: a.y }, { x: b.x, y: b.y }];
    }

    function organizarTracos(tracos, paredes, cfg, dpi = 150) {
      const tolAng = Number(cfg.toleranciaAnguloGraus ?? 8);
      const raioSnap = Number(cfg.raioSnap ?? 25);
      const passoGrid = dpi * 0.5;
      const segs = [];

      for (const t of tracos) {
        if (!t.pontos || t.pontos.length < 2) continue;
        let pts = t.linhaReta ? [t.pontos[0], t.pontos[t.pontos.length - 1]] : simplificarRDP(t.pontos, cfg.toleranciaRDP ?? 12);
        pts = pts.map((p) => ({ x: p.x, y: p.y }));

        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const dx = b.x - a.x, dy = b.y - a.y;
          const absA = Math.abs(Math.atan2(dy, dx) * (180 / Math.PI));
          if (absA <= tolAng || Math.abs(absA - 180) <= tolAng) b.y = a.y;
          else if (Math.abs(absA - 90) <= tolAng) b.x = a.x;
          else if (cfg.aceitarDiagonais45 && (Math.abs(absA - 45) <= tolAng || Math.abs(absA - 135) <= tolAng)) {
            const m = (Math.abs(dx) + Math.abs(dy)) * 0.5;
            b.x = a.x + Math.sign(dx || 1) * m;
            b.y = a.y + Math.sign(dy || 1) * m;
          }
        }

        if (cfg.alinharAoGrid) {
          for (const p of pts) {
            p.x = Math.round(p.x / passoGrid) * passoGrid;
            p.y = Math.round(p.y / passoGrid) * passoGrid;
          }
        }

        if (pts.length >= 3 && dist(pts[0], pts[pts.length - 1]) <= raioSnap * 1.4) {
          pts[pts.length - 1] = { x: pts[0].x, y: pts[0].y };
        }

        for (let i = 0; i < pts.length - 1; i++) {
          if (dist(pts[i], pts[i + 1]) >= 8) {
            segs.push({
              id: `par_${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${i}`,
              x1: pts[i].x,
              y1: pts[i].y,
              x2: pts[i + 1].x,
              y2: pts[i + 1].y,
              porta: false,
              aberta: false
            });
          }
        }
      }
      return segs;
    }

    function calcularPoligonoVisibilidade(origem, raio, paredes, passos = 40) {
      if (raio <= 0) return [];
      const ox = origem.x, oy = origem.y;
      const locais = paredes.filter((p) => !p.aberta && !(
        Math.max(p.x1, p.x2) < ox - raio || Math.min(p.x1, p.x2) > ox + raio ||
        Math.max(p.y1, p.y2) < oy - raio || Math.min(p.y1, p.y2) > oy + raio
      ));

      const angs = [];
      for (let i = 0; i < passos; i++) angs.push((i / passos) * Math.PI * 2 - Math.PI);
      const eps = 0.0002;
      for (const p of locais) {
        const a1 = Math.atan2(p.y1 - oy, p.x1 - ox);
        const a2 = Math.atan2(p.y2 - oy, p.x2 - ox);
        angs.push(a1 - eps, a1, a1 + eps, a2 - eps, a2, a2 + eps);
      }
      angs.sort((a, b) => a - b);

      const poly = [];
      for (let i = 0; i < angs.length; i++) {
        if (i > 0 && Math.abs(angs[i] - angs[i - 1]) < 1e-5) continue;
        const dx = Math.cos(angs[i]), dy = Math.sin(angs[i]);
        let menT = raio;
        for (const p of locais) {
          const sx = p.x2 - p.x1, sy = p.y2 - p.y1;
          const den = dx * sy - dy * sx;
          if (Math.abs(den) < 1e-8) continue;
          const t = ((p.x1 - ox) * sy - (p.y1 - oy) * sx) / den;
          const u = ((p.x1 - ox) * dy - (p.y1 - oy) * dx) / den;
          if (t >= 0 && u >= -1e-4 && u <= 1.0001 && t < menT) menT = t;
        }
        poly.push({ x: ox + dx * menT, y: oy + dy * menT });
      }
      return poly;
    }

    function polyParaCmds(poly) {
      if (!poly || poly.length < 3) return [];
      const c = [[Command.MOVE, poly[0].x, poly[0].y]];
      for (let i = 1; i < poly.length; i++) c.push([Command.LINE, poly[i].x, poly[i].y]);
      c.push([Command.CLOSE]);
      return c;
    }

    // Função única de Luz com Falloff suave (na camada DRAWING para aparecer sempre!)
    function gerarLuzFalloff(idBase, origem, raioPx, cor, falloff, polyVis, passos = 14) {
      if (!polyVis || polyVis.length < 3 || raioPx <= 0) return [];
      const exp = 1.0 + Math.max(0, Math.min(1, falloff ?? 0.5)) * 3.0;
      const fInt = (d) => (d >= 1 ? 0 : Math.pow(1 - d * d, exp));
      const itens = [];

      for (let k = passos; k >= 1; k--) {
        const dExt = k / passos, dInt = (k - 1) / passos;
        const deltaOp = (fInt(dInt) - fInt(dExt)) * 0.38;
        if (deltaOp <= 0.001) continue;
        const rAlvo = raioPx * dExt;
        const polyCamada = k === passos ? polyVis : polyVis.map((pt) => {
          const vx = pt.x - origem.x, vy = pt.y - origem.y, d = Math.hypot(vx, vy);
          return d <= rAlvo || d === 0 ? pt : { x: origem.x + (vx * rAlvo) / d, y: origem.y + (vy * rAlvo) / d };
        });
        itens.push(
          buildPath()
            .id(`${PREFIXO_RENDER_LUZ}${idBase}_${k}`)
            .commands(polyParaCmds(polyCamada))
            .fillColor(cor || "#ffe8b6")
            .fillOpacity(deltaOp)
            .strokeOpacity(0)
            .layer("DRAWING")
            .zIndex(1000 + (passos - k))
            .locked(true)
            .disableHit(true)
            .build()
        );
      }
      return itens;
    }

    async function obterCfg() {
      const meta = await OBR.scene.getMetadata();
      return { ...CONFIG_PADRAO, ...(meta[CHAVE_CONFIG] || {}) };
    }

    async function obterParedes() {
      const meta = await OBR.scene.getMetadata();
      return meta[CHAVE_PAREDES]?.segmentos || [];
    }

    async function atualizarPreviaVerde() {
      const locais = await OBR.scene.local.getItems();
      const ant = locais.filter((i) => i.id.startsWith(PREFIXO_PREVIA)).map((i) => i.id);
      if (ant.length > 0) await OBR.scene.local.deleteItems(ant);

      const brutos = locais.filter((i) => Boolean(i.metadata?.[CHAVE_TRACO_BRUTO])).map((i) => i.metadata[CHAVE_TRACO_BRUTO]);
      if (brutos.length === 0) return;

      const cfg = await obterCfg();
      const dpi = await OBR.scene.grid.getDpi();
      const paredes = await obterParedes();
      const segs = organizarTracos(brutos, paredes, cfg, dpi);
      const esp = Math.max(10, Math.round(dpi * 0.07));

      const novos = segs.map((s, idx) =>
        buildCurve()
          .id(`${PREFIXO_PREVIA}${idx}`)
          .points([{ x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }])
          .tension(0)
          .strokeColor("#a3e635")
          .strokeWidth(esp)
          .strokeOpacity(1)
          .fillOpacity(0)
          .layer("TEXT")
          .zIndex(99000)
          .locked(true)
          .disableHit(true)
          .build()
      );
      if (novos.length > 0) await OBR.scene.local.addItems(novos);
    }

    async function recalcularCena() {
      if (!(await OBR.scene.isReady())) return;
      const role = await OBR.player.getRole();
      const dpi = await OBR.scene.grid.getDpi();
      const cfg = await obterCfg();
      const paredes = await obterParedes();
      const itensCena = await OBR.scene.items.getItems();

      const locais = await OBR.scene.local.getItems();
      const limpar = locais
        .filter((i) =>
          i.id.startsWith(PREFIXO_PAREDE_GM) ||
          i.id.startsWith(PREFIXO_RENDER_LUZ) ||
          i.id.startsWith(PREFIXO_MARCADOR_LUZ) ||
          i.id === ID_NEVOA_EXPLORADA ||
          i.id === ID_NEVOA_ESCURIDAO
        )
        .map((i) => i.id);
      if (limpar.length > 0) await OBR.scene.local.deleteItems(limpar);

      const adicionar = [];

      // 1. Paredes salvas (Laranja forte na camada TEXT para ficar sempre visível!)
      if (role === "GM" && cfg.mostrarParedesMestre && paredes.length > 0) {
        const esp = Math.max(9, Math.round(dpi * 0.065));
        for (const p of paredes) {
          adicionar.push(
            buildCurve()
              .id(`${PREFIXO_PAREDE_GM}${p.id}`)
              .points([{ x: p.x1, y: p.y1 }, { x: p.x2, y: p.y2 }])
              .tension(0)
              .strokeColor("#ff6b00")
              .strokeWidth(esp)
              .strokeOpacity(0.95)
              .fillOpacity(0)
              .layer("TEXT")
              .zIndex(90000)
              .locked(true)
              .disableHit(true)
              .build()
          );
        }
      }

      // 2. Fontes de [Luz] Soltas e Tokens com Luz/Visão
      const poligonosVisiveisAgora = [];
      const poligonosMemoria = [];

      for (const it of itensCena) {
        const lCfg = it.metadata?.[CHAVE_LUZ_SOLTA];
        if (lCfg) {
          if (lCfg.ativa) {
            const rPx = (lCfg.raioCelulas || 4) * dpi;
            const poly = calcularPoligonoVisibilidade(it.position, rPx, paredes);
            poligonosVisiveisAgora.push(poly);
            adicionar.push(...gerarLuzFalloff(it.id, it.position, rPx, lCfg.cor, lCfg.falloff, poly, cfg.passosGradienteLuz));
          }
          if (role === "GM") {
            adicionar.push(
              buildShape()
                .id(`${PREFIXO_MARCADOR_LUZ}${it.id}`)
                .shapeType("CIRCLE")
                .width(34)
                .height(34)
                .position(it.position)
                .fillColor(lCfg.ativa ? lCfg.cor || "#fde047" : "#64748b")
                .fillOpacity(0.95)
                .strokeColor("#000000")
                .strokeWidth(4)
                .layer("TEXT")
                .zIndex(95000)
                .locked(true)
                .disableHit(true)
                .build()
            );
          }
        }

        const tCfg = it.metadata?.[CHAVE_TOKEN_CFG];
        if (tCfg && (tCfg.luzAtiva || tCfg.visaoAtiva)) {
          const rLuz = tCfg.luzAtiva ? (tCfg.raioLuz || 4) * dpi : 0;
          const rVis = tCfg.visaoAtiva ? (tCfg.raioVisao || 6) * dpi : 0;
          const rMax = Math.max(rLuz, rVis);
          const poly = calcularPoligonoVisibilidade(it.position, rMax, paredes);
          poligonosVisiveisAgora.push(poly);

          if (tCfg.luzAtiva) {
            const polyL = rLuz === rMax ? poly : calcularPoligonoVisibilidade(it.position, rLuz, paredes);
            adicionar.push(...gerarLuzFalloff(it.id, it.position, rLuz, tCfg.corLuz, tCfg.falloffLuz, polyL, cfg.passosGradienteLuz));
          }

          // Guarda trilha de memória simplificada nos metadados do token
          const mem = it.metadata?.[CHAVE_TOKEN_MEM]?.pontos || [];
          for (const pt of mem) {
            poligonosMemoria.push(calcularPoligonoVisibilidade(pt.pos, pt.r, paredes, 24));
          }
          const ult = mem[mem.length - 1];
          if (role === "GM" && (!ult || dist(ult.pos, it.position) > dpi * 0.6)) {
            const novaMem = [...mem.slice(-25), { pos: { x: Math.round(it.position.x), y: Math.round(it.position.y) }, r: Math.round(rMax) }];
            OBR.scene.items.updateItems([it.id], (lista) => {
              for (const tk of lista) tk.metadata[CHAVE_TOKEN_MEM] = { pontos: novaMem };
            });
          }
        }
      }

      // 3. Névoa de 3 Estados (na camada DRAWING para aparecer sempre em cima do mapa!)
      if (cfg.nevoaAtiva) {
        const bx1 = -12000, by1 = -12000, bx2 = 12000, by2 = 12000;
        const contorno = [
          [Command.MOVE, bx1, by1],
          [Command.LINE, bx2, by1],
          [Command.LINE, bx2, by2],
          [Command.LINE, bx1, by2],
          [Command.CLOSE]
        ];

        const furosAgora = [];
        for (const p of poligonosVisiveisAgora) furosAgora.push(...polyParaCmds(p));

        const furosMemoria = [...furosAgora];
        for (const p of poligonosMemoria) furosMemoria.push(...polyParaCmds(p));

        const mestreSuave = role === "GM" && cfg.modoVisaoMestre === "TUDO";
        const opExplorado = mestreSuave ? 0.45 : (cfg.opacidadeNevoaExplorada ?? 0.75);
        const opEscuridao = mestreSuave ? 0.72 : 1.0;

        // Estado 2: "A névoa de hoje" (Explorado, sem luz agora)
        adicionar.push(
          buildPath()
            .id(ID_NEVOA_EXPLORADA)
            .commands([...contorno, ...furosAgora])
            .fillRule("EVENODD")
            .fillColor(cfg.corNevoaExplorada || "#181822")
            .fillOpacity(opExplorado)
            .strokeOpacity(0)
            .layer("DRAWING")
            .zIndex(5000)
            .locked(true)
            .disableHit(true)
            .build()
        );

        // Estado 1: Escuridão Total (Nunca explorado)
        if (!cfg.revelarTudo) {
          adicionar.push(
            buildPath()
              .id(ID_NEVOA_ESCURIDAO)
              .commands([...contorno, ...furosMemoria])
              .fillRule("EVENODD")
              .fillColor("#000000")
              .fillOpacity(opEscuridao)
              .strokeOpacity(0)
              .layer("DRAWING")
              .zIndex(6000)
              .locked(true)
              .disableHit(true)
              .build()
          );
        }
      }

      if (adicionar.length > 0) await OBR.scene.local.addItems(adicionar);
    }

    async function salvarNovoTraco(pontos, linhaReta) {
      const cfg = await obterCfg();
      const dpi = await OBR.scene.grid.getDpi();

      // Se "Concluir automático" estiver marcado, já grava a parede direto!
      if (cfg.autoConcluir) {
        const atuais = await obterParedes();
        const novos = organizarTracos([{ pontos, linhaReta }], atuais, cfg, dpi);
        await OBR.scene.setMetadata({
          [CHAVE_PAREDES]: { atualizadoEm: Date.now(), segmentos: [...atuais, ...novos] }
        });
        return;
      }

      const esp = Math.max(8, Math.round(dpi * 0.05));
      const item = buildCurve()
        .id(`${ID_EXT}_bruto_${Date.now()}`)
        .points(pontos)
        .tension(0)
        .strokeColor("#00e5ff")
        .strokeWidth(esp)
        .strokeDash([esp * 2, esp * 1.5])
        .fillOpacity(0)
        .layer("TEXT")
        .zIndex(98000)
        .locked(true)
        .disableHit(true)
        .metadata({ [CHAVE_TRACO_BRUTO]: { pontos, linhaReta } })
        .build();

      await OBR.scene.local.addItems([item]);
      await atualizarPreviaVerde();
    }

    let tracoAtivo = null;
    let ponto1Reta = null;
    let ocupado = false;

    OBR.onReady(async () => {
      const idFerramenta = `${ID_EXT}/ferramenta-principal`;
      const idModoLapis = `${ID_EXT}/modo-lapis`;
      const idModoLuz = `${ID_EXT}/modo-luz`;
      const idModoBorracha = `${ID_EXT}/modo-borracha`;

      await OBR.tool.create({
        id: idFerramenta,
        defaultMode: idModoLapis,
        icons: [{ icon: "https://gaduarte14.github.io/nevoa/icon.svg", label: "Paredes, Luz e Névoa", filter: { roles: ["GM"] } }]
      });

      await OBR.tool.createMode({
        id: idModoLapis,
        icons: [{ icon: "https://gaduarte14.github.io/nevoa/icon.svg", label: "1. Desenhar Parede (Lápis)", filter: { activeTools: [idFerramenta], roles: ["GM"] } }],
        cursors: [{ cursor: "crosshair" }],
        async onToolClick(_, ev) {
          const pt = { x: ev.pointerPosition.x, y: ev.pointerPosition.y };
          if (!ponto1Reta) {
            ponto1Reta = pt;
            await OBR.scene.local.addItems([
              buildShape().id(ID_PONTO1_RETA).shapeType("CIRCLE").width(26).height(26).position(pt).fillColor("#00e5ff").strokeColor("#ffffff").strokeWidth(3).layer("TEXT").zIndex(99999).locked(true).disableHit(true).build()
            ]);
          } else {
            const p1 = ponto1Reta;
            ponto1Reta = null;
            await OBR.scene.local.deleteItems([ID_PONTO1_RETA]);
            await salvarNovoTraco([p1, pt], true);
          }
        },
        async onToolDragStart(_, ev) {
          ponto1Reta = null;
          await OBR.scene.local.deleteItems([ID_PONTO1_RETA]);
          const cfg = await obterCfg();
          const dpi = await OBR.scene.grid.getDpi();
          const esp = Math.max(8, Math.round(dpi * 0.055));
          const p0 = { x: ev.pointerPosition.x, y: ev.pointerPosition.y };
          tracoAtivo = { pontos: [p0, { x: p0.x + 1, y: p0.y + 1 }], linhaReta: Boolean(ev.shiftKey || cfg.modoLinhaReta) };

          await OBR.scene.local.addItems([
            buildCurve().id(ID_TRACO_ARRASTO).points(tracoAtivo.pontos).tension(0).strokeColor("#00e5ff").strokeWidth(esp).strokeDash([esp * 2, esp * 1.5]).fillOpacity(0).layer("TEXT").zIndex(99999).locked(true).disableHit(true).build()
          ]);
        },
        onToolDragMove(_, ev) {
          if (!tracoAtivo) return;
          const pt = { x: ev.pointerPosition.x, y: ev.pointerPosition.y };
          if (tracoAtivo.linhaReta) tracoAtivo.pontos = [tracoAtivo.pontos[0], pt];
          else if (dist(pt, tracoAtivo.pontos[tracoAtivo.pontos.length - 1]) >= 4) tracoAtivo.pontos.push(pt);

          if (!ocupado) {
            ocupado = true;
            requestAnimationFrame(async () => {
              try {
                if (tracoAtivo) {
                  const pts = tracoAtivo.pontos.slice();
                  await OBR.scene.local.updateItems([ID_TRACO_ARRASTO], (l) => { for (const i of l) i.points = pts; });
                }
              } finally { ocupado = false; }
            });
          }
        },
        async onToolDragEnd() {
          await OBR.scene.local.deleteItems([ID_TRACO_ARRASTO]);
          if (tracoAtivo && tracoAtivo.pontos.length >= 2) {
            const t = tracoAtivo;
            tracoAtivo = null;
            await salvarNovoTraco(t.pontos, t.linhaReta);
          }
        }
      });

      await OBR.tool.createMode({
        id: idModoLuz,
        icons: [{ icon: "https://gaduarte14.github.io/nevoa/icon.svg", label: "2. [Luz] Criar Fonte de Luz", filter: { activeTools: [idFerramenta], roles: ["GM"] } }],
        cursors: [{ cursor: "pointer" }],
        async onToolClick(_, ev) {
          const cfg = await obterCfg();
          const nova = buildShape()
            .name("Fonte de Luz [Luz]")
            .shapeType("CIRCLE")
            .width(45)
            .height(45)
            .position(ev.pointerPosition)
            .fillOpacity(0)
            .strokeOpacity(0)
            .layer("PROP")
            .metadata({ [CHAVE_LUZ_SOLTA]: { ativa: true, raioCelulas: 5, cor: cfg.corLuzPadrao, falloff: cfg.falloffPadrao } })
            .build();
          await OBR.scene.items.addItems([nova]);
          await OBR.player.select([nova.id]);
        }
      });

      await OBR.tool.createMode({
        id: idModoBorracha,
        icons: [{ icon: "https://gaduarte14.github.io/nevoa/icon.svg", label: "3. Borracha de Parede", filter: { activeTools: [idFerramenta], roles: ["GM"] } }],
        cursors: [{ cursor: "pointer" }],
        async onToolClick(_, ev) {
          const paredes = await obterParedes();
          let idx = -1, men = 35;
          paredes.forEach((p, i) => {
            const d = projetarNoSeg(ev.pointerPosition, { x: p.x1, y: p.y1 }, { x: p.x2, y: p.y2 }).dist;
            if (d <= men) { men = d; idx = i; }
          });
          if (idx !== -1) {
            await OBR.scene.setMetadata({ [CHAVE_PAREDES]: { atualizadoEm: Date.now(), segmentos: paredes.filter((_, i) => i !== idx) } });
          }
        }
      });

      if (await OBR.scene.isReady()) await recalcularCena();
      OBR.scene.onReadyChange((ok) => { if (ok) recalcularCena(); });
      OBR.scene.onMetadataChange(() => { atualizarPreviaVerde(); recalcularCena(); });
      OBR.scene.items.onChange(() => recalcularCena());
    });
  </script>
</body>
</html>
