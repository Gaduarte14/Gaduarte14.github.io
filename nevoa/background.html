<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>3 em 1 — Segundo Plano</title>
  </head>
  <body>
    <script type="module">
      import OBR, {
        buildWall,
        buildCurve,
        buildLight,
        buildShape
      } from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";

      import {
        NS,
        lerConfig,
        enviarMensagem,
        escutarMensagens,
        distancia,
        distanciaPontoSegmento,
        processarTraco,
        temVisadaLivre,
        lerParedesDaCena,
        criarPatchMetadadosParedes,
        lerMemoriaLocalJogador,
        salvarMemoriaLocalJogador
      } from "./core.js";

      const svgUri = (conteudo) =>
        `data:image/svg+xml;utf8,${encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${conteudo}</svg>`
        )}`;

      const ICONES = {
        parede: svgUri(`<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 16h18M9 4v6M15 10v6M9 16v4"/>`),
        lapis: svgUri(`<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>`),
        linha: svgUri(`<circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5 17.5 6.5"/>`),
        porta: svgUri(`<path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><path d="M14 12v.01"/>`),
        borracha: svgUri(`<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>`),
        concluir: svgUri(`<polyline points="20 6 9 17 4 12"/>`),
        desfazer: svgUri(`<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>`),
        refazer: svgUri(`<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>`),
        cancelar: svgUri(`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`),
        luz: svgUri(`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`),
        cone: svgUri(`<path d="M3 12h2l7-8v16l-7-8H3z"/><path d="M16 8c1.5 1.5 1.5 6.5 0 8"/>`),
        apagarLuz: svgUri(`<line x1="2" y1="2" x2="22" y2="22"/><path d="M12 6a6 6 0 0 1 6 6c0 1.3-.4 2.5-1.1 3.5"/><path d="M8.5 8.5A6 6 0 0 0 12 18"/>`)
      };

      const META_LUZ_TOKEN = `${NS}/luzConfig`;

      let config = lerConfig();
      let meuPlayerId = "";
      let meuNome = "";
      let souMestre = false;
      let cenaPronta = false;
      let gridDpi = 150;

      let paredesCena = [];
      let versaoAplicada = -1;

      let pontosAtuais = [];
      let pontoInicialLinha = null;
      let tracosPendentes = [];
      let tracosDesfeitos = [];

      let historicoCena = [];
      let futuroCena = [];

      // IDs de itens locais (exclusivos da tela deste jogador)
      let idsParedesLocais = [];
      let idsRascunhoLocais = [];
      let idsLuzesLocais = [];
      let idsMemoriaLocais = [];

      let celulasVisitadas = new Set();
      let timerMemoria = null;

      // ========================================================================
      // 1. Paredes Locais (Wall Nativa + Linha Vermelha do Mestre)
      // ========================================================================
      async function reconstruirParedesLocais() {
        if (!cenaPronta) return;
        try {
          if (idsParedesLocais.length > 0) {
            await OBR.scene.local.deleteItems(idsParedesLocais);
            idsParedesLocais = [];
          }

          const novosItens = [];

          for (const w of paredesCena) {
            if (!w.points || w.points.length < 2) continue;

            if (!(w.porta && w.aberta)) {
              const wallBuilder = buildWall()
                .id(`local_wall_${w.id}`)
                .points(w.points)
                .metadata({ [`${NS}/wallId`]: w.id });

              if (typeof wallBuilder.doubleSided === "function") {
                wallBuilder.doubleSided(true);
              }
              const wallItem = wallBuilder.build();
              novosItens.push(wallItem);
              idsParedesLocais.push(wallItem.id);
            }

            if (souMestre && config.mostrarParedesMestre) {
              const cor = w.porta
                ? w.aberta
                  ? "#22c55e"
                  : "#f59e0b"
                : "#ef4444";

              const traco = w.porta && w.aberta ? [10, 10] : w.porta ? [16, 6] : [];

              const curve = buildCurve()
                .id(`local_vis_${w.id}`)
                .points(w.points)
                .strokeColor(cor)
                .strokeWidth(Number(config.espessuraParede) || 6)
                .strokeDash(traco)
                .fillOpacity(0)
                .tension(0)
                .layer("DRAWING")
                .disableHit(true)
                .metadata({ [`${NS}/visId`]: w.id })
                .build();

              novosItens.push(curve);
              idsParedesLocais.push(curve.id);
            }
          }

          if (novosItens.length > 0) {
            await OBR.scene.local.addItems(novosItens);
          }
        } catch (err) {
          console.error("[3em1] Erro ao reconstruir paredes locais:", err);
        }
      }

      async function atualizarRascunhoEPrevia() {
        if (!cenaPronta) return;
        try {
          if (idsRascunhoLocais.length > 0) {
            await OBR.scene.local.deleteItems(idsRascunhoLocais);
            idsRascunhoLocais = [];
          }

          const itens = [];

          for (const t of tracosPendentes) {
            if (!t.points || t.points.length < 2) continue;
            const prev = buildCurve()
              .id(`prev_${t.id}`)
              .points(t.points)
              .strokeColor("#14b8a6")
              .strokeWidth(6)
              .fillOpacity(0)
              .tension(0)
              .layer("DRAWING")
              .disableHit(true)
              .build();
            itens.push(prev);
            idsRascunhoLocais.push(prev.id);
          }

          if (pontosAtuais.length >= 2) {
            const draft = buildCurve()
              .id("draft_ativo_3em1")
              .points(pontosAtuais)
              .strokeColor("#f97316")
              .strokeWidth(5)
              .strokeDash([12, 8])
              .fillOpacity(0)
              .tension(0)
              .layer("DRAWING")
              .disableHit(true)
              .build();
            itens.push(draft);
            idsRascunhoLocais.push(draft.id);
          }

          if (itens.length > 0) {
            await OBR.scene.local.addItems(itens);
          }
          notificarEstadoPopover();
        } catch (err) {
          console.error("[3em1] Erro ao desenhar prévia:", err);
        }
      }

      async function salvarParedesNaCena(novaLista, registrarHistorico = true) {
        if (!cenaPronta) return;
        if (registrarHistorico) {
          historicoCena.push(JSON.parse(JSON.stringify(paredesCena)));
          if (historicoCena.length > 30) historicoCena.shift();
          futuroCena = [];
        }

        paredesCena = novaLista;
        const metaAtual = await OBR.scene.getMetadata();
        const patch = criarPatchMetadadosParedes(paredesCena, metaAtual);
        versaoAplicada = patch[`${NS}/paredes-index`].versao;
        await OBR.scene.setMetadata(patch);
        await reconstruirParedesLocais();
        notificarEstadoPopover();
      }

      async function concluirTracosPendentes() {
        if (tracosPendentes.length === 0) {
          await OBR.notification.show("Nenhum traço pendente para concluir.", "INFO");
          return;
        }
        const novaLista = [...paredesCena, ...tracosPendentes];
        const qtd = tracosPendentes.length;
        tracosPendentes = [];
        tracosDesfeitos = [];
        pontosAtuais = [];
        pontoInicialLinha = null;

        await atualizarRascunhoEPrevia();
        await salvarParedesNaCena(novaLista, true);
        await OBR.notification.show(`${qtd} parede(s) gravada(s) na cena!`, "SUCCESS");
      }

      async function cancelarRascunho() {
        pontosAtuais = [];
        pontoInicialLinha = null;
        tracosPendentes = [];
        tracosDesfeitos = [];
        await atualizarRascunhoEPrevia();
      }

      async function acaoDesfazer() {
        if (tracosPendentes.length > 0) {
          const removido = tracosPendentes.pop();
          tracosDesfeitos.push(removido);
          await atualizarRascunhoEPrevia();
          return;
        }
        if (historicoCena.length > 0) {
          futuroCena.push(JSON.parse(JSON.stringify(paredesCena)));
          const anterior = historicoCena.pop();
          await salvarParedesNaCena(anterior, false);
          await OBR.notification.show("Última alteração de parede desfeita.", "INFO");
        }
      }

      async function acaoRefazer() {
        if (tracosDesfeitos.length > 0) {
          const restaurado = tracosDesfeitos.pop();
          tracosPendentes.push(restaurado);
          await atualizarRascunhoEPrevia();
          return;
        }
        if (futuroCena.length > 0) {
          historicoCena.push(JSON.parse(JSON.stringify(paredesCena)));
          const proximo = futuroCena.pop();
          await salvarParedesNaCena(proximo, false);
          await OBR.notification.show("Alteração de parede refeita.", "INFO");
        }
      }

      function encontrarParedeMaisProxima(ponto, raioMax = 36) {
        let melhorIndice = -1;
        let menorDist = raioMax;

        for (let i = 0; i < paredesCena.length; i++) {
          const pts = paredesCena[i].points || [];
          for (let j = 0; j < pts.length - 1; j++) {
            const d = distanciaPontoSegmento(ponto, pts[j], pts[j + 1]);
            if (d <= menorDist) {
              menorDist = d;
              melhorIndice = i;
            }
          }
        }
        return melhorIndice;
      }

      async function apagarParedeEm(ponto) {
        const idx = encontrarParedeMaisProxima(ponto, 38);
        if (idx === -1) return;
        const novaLista = paredesCena.filter((_, i) => i !== idx);
        await salvarParedesNaCena(novaLista, true);
      }

      async function alternarPortaEm(ponto) {
        const idx = encontrarParedeMaisProxima(ponto, 42);
        if (idx === -1) {
          await OBR.notification.show("Clique sobre uma parede para torná-la Porta ou abrir/fechar.", "INFO");
          return;
        }
        const novaLista = JSON.parse(JSON.stringify(paredesCena));
        const alvo = novaLista[idx];
        if (!alvo.porta) {
          alvo.porta = true;
          alvo.aberta = false;
          await OBR.notification.show("Parede convertida em Porta (Fechada). Clique de novo para abrir!", "SUCCESS");
        } else {
          alvo.aberta = !alvo.aberta;
          await OBR.notification.show(alvo.aberta ? "Porta Aberta (visão liberada)!" : "Porta Fechada!", "INFO");
        }
        await salvarParedesNaCena(novaLista, true);
      }

      // ========================================================================
      // 2. Luz com Falloff Individual (Cada jogador só vê a luz do SEU token!)
      // ========================================================================
      function tokenPertenceAoJogadorAtual(token, cfgLuz) {
        // O Mestre sempre enxerga todas as luzes
        if (souMestre) return true;

        // Se a luz foi marcada explicitamente para TODOS (ex: fogueira ou visão compartilhada)
        if (!cfgLuz.visaoIndividual || cfgLuz.donoId === "TODOS") {
          return true;
        }

        // Se o donoId já está vinculado ao ID deste jogador
        if (cfgLuz.donoId && cfgLuz.donoId !== "AUTO") {
          return cfgLuz.donoId === meuPlayerId;
        }

        // Se está em modo AUTO e o próprio jogador criou o token
        if (token.createdUserId === meuPlayerId) {
          return true;
        }

        return false;
      }

      // Reconstrói as luzes APENAS localmente (OBR.scene.local) na tela de quem tem permissão
      async function sincronizarLuzesLocais() {
        if (!cenaPronta) return;
        try {
          if (idsLuzesLocais.length > 0) {
            await OBR.scene.local.deleteItems(idsLuzesLocais);
            idsLuzesLocais = [];
          }

          const todosItens = await OBR.scene.items.getItems();
          const tokensComLuz = todosItens.filter((it) => Boolean(it.metadata?.[META_LUZ_TOKEN]));

          const novasLuzesLocais = [];

          for (const tok of tokensComLuz) {
            const cfgLuz = tok.metadata[META_LUZ_TOKEN];
            if (!cfgLuz) continue;

            // Verifica se este jogador pode ver a luz deste token!
            if (!tokenPertenceAoJogadorAtual(tok, cfgLuz)) {
              continue; // Não cria a luz na tela do amigo!
            }

            const alcancePx = Math.max(0.5, Number(cfgLuz.alcanceQuadrados) || 6) * gridDpi;
            const fontePx = Math.max(0.1, Number(cfgLuz.raioFonteQuadrados) || 1) * gridDpi;
            const falloffVal = Math.max(0.05, Number(cfgLuz.falloff) || 0.8);
            const outer = Math.min(360, Math.max(15, Number(cfgLuz.anguloCone) || 360));
            const inner = outer < 360 ? Math.min(outer, Math.max(5, Number(cfgLuz.anguloInterno) || 35)) : 360;
            const tipo = cfgLuz.tipoLuz || "PRIMARY";

            const builder = buildLight()
              .id(`local_light_${tok.id}`)
              .name(`Luz de ${tok.name || "Token"}`)
              .position(tok.position)
              .rotation(Number(cfgLuz.rotacaoFeixe ?? tok.rotation ?? 0))
              .attenuationRadius(alcancePx)
              .sourceRadius(fontePx)
              .falloff(falloffVal)
              .outerAngle(outer)
              .innerAngle(inner)
              .lightType(tipo)
              .attachedTo(tok.id);

            if (typeof builder.disableAttachmentBehavior === "function") {
              builder.disableAttachmentBehavior(["SCALE"]);
            }

            const itemLocal = builder.build();
            novasLuzesLocais.push(itemLocal);
            idsLuzesLocais.push(itemLocal.id);
          }

          if (novasLuzesLocais.length > 0) {
            await OBR.scene.local.addItems(novasLuzesLocais);
          }
        } catch (err) {
          console.error("[3em1] Erro ao sincronizar luzes locais:", err);
        }
      }

      function montarDadosLuzAtual() {
        // Se quem está aplicando for um Jogador, já vincula direto ao ID dele!
        let donoId = config.donoLuzEscolhido || "AUTO";
        if (!souMestre) {
          donoId = meuPlayerId;
        }

        return {
          visaoIndividual: Boolean(config.visaoIndividual),
          donoId,
          alcanceQuadrados: Number(config.alcanceQuadrados) || 6,
          raioFonteQuadrados: Number(config.raioFonteQuadrados) || 1,
          falloff: Number(config.falloff) || 0.8,
          anguloCone: Number(config.anguloCone) || 360,
          anguloInterno: Number(config.anguloInterno) || 40,
          tipoLuz: config.tipoLuz || "PRIMARY",
          rotacaoFeixe: 0
        };
      }

      async function aplicarLuzEmTokenAlvo(alvo) {
        if (!alvo || alvo.layer === "MAP" || alvo.type === "LIGHT") {
          await OBR.notification.show(
            "Clique sobre um Token para anexar a luz individual a ele!",
            "WARNING"
          );
          return;
        }

        const dadosLuz = montarDadosLuzAtual();

        await OBR.scene.items.updateItems([alvo.id], (items) => {
          for (const item of items) {
            item.metadata[META_LUZ_TOKEN] = {
              ...dadosLuz,
              rotacaoFeixe: item.rotation || 0
            };
          }
        });

        await sincronizarLuzesLocais();
        if (config.memoriaAtiva) agendarAtualizacaoMemoria();
        notificarEstadoPopover();

        const msgDono =
          !dadosLuz.visaoIndividual || dadosLuz.donoId === "TODOS"
            ? "Luz compartilhada aplicada ao token!"
            : dadosLuz.donoId === "AUTO"
            ? "Luz individual aplicada! (Vinculará ao 1º jogador que clicar no token)"
            : "Luz exclusiva vinculada ao jogador!";

        await OBR.notification.show(msgDono, "SUCCESS");
      }

      async function aplicarLuzNosSelecionados() {
        const selecao = await OBR.player.getSelection();
        if (!selecao || selecao.length === 0) {
          await OBR.notification.show("Selecione pelo menos um token no mapa primeiro.", "WARNING");
          return;
        }

        const dadosLuz = montarDadosLuzAtual();

        await OBR.scene.items.updateItems(selecao, (items) => {
          for (const item of items) {
            item.metadata[META_LUZ_TOKEN] = {
              ...dadosLuz,
              rotacaoFeixe: item.rotation || 0
            };
          }
        });

        await sincronizarLuzesLocais();
        if (config.memoriaAtiva) agendarAtualizacaoMemoria();
        notificarEstadoPopover();
        await OBR.notification.show(`Luz configurada em ${selecao.length} token(s)!`, "SUCCESS");
      }

      async function removerLuzDeAlvoOuPonto(posicao, alvo) {
        if (alvo && alvo.metadata?.[META_LUZ_TOKEN]) {
          await OBR.scene.items.updateItems([alvo.id], (items) => {
            for (const item of items) {
              delete item.metadata[META_LUZ_TOKEN];
            }
          });
          await sincronizarLuzesLocais();
          await OBR.notification.show("Luz removida do token.", "INFO");
          notificarEstadoPopover();
          return;
        }

        const todos = await OBR.scene.items.getItems((it) => Boolean(it.metadata?.[META_LUZ_TOKEN]));
        const proximo = todos.find((t) => distancia(t.position, posicao) <= gridDpi * 0.8);
        if (proximo) {
          await OBR.scene.items.updateItems([proximo.id], (items) => {
            for (const item of items) {
              delete item.metadata[META_LUZ_TOKEN];
            }
          });
          await sincronizarLuzesLocais();
          await OBR.notification.show("Luz removida do token.", "INFO");
          notificarEstadoPopover();
        }
      }

      // ========================================================================
      // 3. Memória de Névoa 100% Individual (Rastreia só os tokens que este player vê!)
      // ========================================================================
      function agendarAtualizacaoMemoria() {
        if (timerMemoria) clearTimeout(timerMemoria);
        timerMemoria = setTimeout(() => {
          registrarPosicoesNaMemoria();
        }, 240);
      }

      async function registrarPosicoesNaMemoria() {
        if (!cenaPronta || !config.memoriaAtiva) return;
        try {
          const todosItens = await OBR.scene.items.getItems();
          // Filtra APENAS os tokens cuja luz pertence a este jogador!
          const meusTokensComLuz = todosItens.filter((it) => {
            const cfgLuz = it.metadata?.[META_LUZ_TOKEN];
            return cfgLuz && tokenPertenceAoJogadorAtual(it, cfgLuz);
          });

          if (meusTokensComLuz.length === 0) {
            await renderizarMemoriaLocal([]);
            return;
          }

          const passoCelula = Math.max(0.75, Number(config.resolucaoCelula) || 1.5) * gridDpi;
          const raioMemPx = Math.max(1, Number(config.raioMemoriaQuadrados) || 5) * gridDpi;

          let mudou = false;
          const origensAtivas = [];

          for (const tok of meusTokensComLuz) {
            const pos = tok.position;
            origensAtivas.push({ pos, raio: raioMemPx });

            const passos = Math.ceil(raioMemPx / passoCelula);
            const cxBase = Math.round(pos.x / passoCelula);
            const cyBase = Math.round(pos.y / passoCelula);

            for (let dx = -passos; dx <= passos; dx++) {
              for (let dy = -passos; dy <= passos; dy++) {
                const centroCelula = {
                  x: (cxBase + dx) * passoCelula,
                  y: (cyBase + dy) * passoCelula
                };
                if (distancia(pos, centroCelula) <= raioMemPx) {
                  if (temVisadaLivre(pos, centroCelula, paredesCena)) {
                    const chave = `${cxBase + dx},${cyBase + dy}`;
                    if (!celulasVisitadas.has(chave)) {
                      celulasVisitadas.add(chave);
                      mudou = true;
                    }
                  }
                }
              }
            }
          }

          if (mudou) {
            salvarMemoriaLocalJogador(meuPlayerId, celulasVisitadas);
          }

          await renderizarMemoriaLocal(origensAtivas);
          notificarEstadoPopover();
        } catch (err) {
          console.error("[3em1] Erro na memória de névoa:", err);
        }
      }

      async function renderizarMemoriaLocal(origensAtivas = []) {
        if (!cenaPronta) return;
        try {
          if (idsMemoriaLocais.length > 0) {
            await OBR.scene.local.deleteItems(idsMemoriaLocais);
            idsMemoriaLocais = [];
          }

          if (!config.memoriaAtiva || celulasVisitadas.size === 0) return;

          const passoCelula = Math.max(0.75, Number(config.resolucaoCelula) || 1.5) * gridDpi;
          const itensMemoria = [];
          const chaves = Array.from(celulasVisitadas).slice(-350);

          for (const chave of chaves) {
            const [gx, gy] = chave.split(",").map(Number);
            if (Number.isNaN(gx) || Number.isNaN(gy)) continue;

            const pos = { x: gx * passoCelula, y: gy * passoCelula };

            const dentroVisaoAtual = origensAtivas.some(
              (o) => distancia(o.pos, pos) < o.raio * 0.65 && temVisadaLivre(o.pos, pos, paredesCena)
            );

            if (dentroVisaoAtual) continue;

            if (config.modoMemoria === "LUZ_SECUNDARIA") {
              const lMem = buildLight()
                .id(`mem_light_${gx}_${gy}`)
                .position(pos)
                .attenuationRadius(passoCelula * 1.45)
                .sourceRadius(passoCelula * 0.25)
                .falloff(Number(config.falloffMemoria) || 1.2)
                .lightType("AUXILIARY")
                .build();
              itensMemoria.push(lMem);
              idsMemoriaLocais.push(lMem.id);
            } else {
              const shape = buildShape()
                .id(`mem_sh_${gx}_${gy}`)
                .shapeType("CIRCLE")
                .width(passoCelula * 1.15)
                .height(passoCelula * 1.15)
                .position(pos)
                .fillColor("#0f172a")
                .fillOpacity(Number(config.opacidadeSombra) || 0.45)
                .strokeOpacity(0)
                .layer("FOG")
                .disableHit(true)
                .build();
              itensMemoria.push(shape);
              idsMemoriaLocais.push(shape.id);
            }
          }

          if (itensMemoria.length > 0) {
            await OBR.scene.local.addItems(itensMemoria);
          }
        } catch (err) {
          console.error("[3em1] Erro ao renderizar memória local:", err);
        }
      }

      async function limparMemoriaNevoa() {
        celulasVisitadas.clear();
        salvarMemoriaLocalJogador(meuPlayerId, celulasVisitadas);
        if (idsMemoriaLocais.length > 0) {
          await OBR.scene.local.deleteItems(idsMemoriaLocais);
          idsMemoriaLocais = [];
        }
        await OBR.notification.show("Memória de névoa limpa!", "INFO");
        notificarEstadoPopover();
      }

      // ========================================================================
      // Registro das Ferramentas na Barra do Owlbear Rodeo
      // ========================================================================
      async function registrarFerramentas() {
        await OBR.tool.create({
          id: `${NS}/tool-parede`,
          icons: [{ icon: ICONES.parede, label: "Parede (Lápis)" }],
          shortcut: "W",
          defaultMode: `${NS}/modo-lapis`,
          disabled: {
            roles: ["PLAYER"],
            permissions: []
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-lapis`,
          icons: [
            {
              icon: ICONES.lapis,
              label: "Lápis (Mão livre)",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onToolDragStart(_, ev) {
            pontosAtuais = [ev.pointerPosition];
            atualizarRascunhoEPrevia();
          },
          onToolDragMove(_, ev) {
            if (pontosAtuais.length === 0) return;
            const ultimo = pontosAtuais[pontosAtuais.length - 1];
            if (distancia(ultimo, ev.pointerPosition) >= 4) {
              pontosAtuais.push(ev.pointerPosition);
              atualizarRascunhoEPrevia();
            }
          },
          onToolDragEnd(_, ev) {
            pontosAtuais.push(ev.pointerPosition);
            const processado = processarTraco(
              pontosAtuais,
              config,
              paredesCena,
              tracosPendentes,
              gridDpi
            );
            pontosAtuais = [];
            if (processado) {
              tracosPendentes.push(processado);
              tracosDesfeitos = [];
            }
            atualizarRascunhoEPrevia();
          },
          onToolDragCancel() {
            pontosAtuais = [];
            atualizarRascunhoEPrevia();
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-linha`,
          icons: [
            {
              icon: ICONES.linha,
              label: "Linha Reta (2 cliques)",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onToolClick(_, ev) {
            if (!pontoInicialLinha) {
              pontoInicialLinha = ev.pointerPosition;
              pontosAtuais = [pontoInicialLinha, pontoInicialLinha];
              atualizarRascunhoEPrevia();
            } else {
              const processado = processarTraco(
                [pontoInicialLinha, ev.pointerPosition],
                config,
                paredesCena,
                tracosPendentes,
                gridDpi
              );
              pontoInicialLinha = null;
              pontosAtuais = [];
              if (processado) {
                tracosPendentes.push(processado);
                tracosDesfeitos = [];
              }
              atualizarRascunhoEPrevia();
            }
          },
          onToolMove(_, ev) {
            if (pontoInicialLinha) {
              pontosAtuais = [pontoInicialLinha, ev.pointerPosition];
              atualizarRascunhoEPrevia();
            }
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-porta`,
          icons: [
            {
              icon: ICONES.porta,
              label: "Porta (Abrir / Fechar)",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onToolClick(_, ev) {
            alternarPortaEm(ev.pointerPosition);
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-apagar`,
          icons: [
            {
              icon: ICONES.borracha,
              label: "Apagar Parede",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onToolClick(_, ev) {
            apagarParedeEm(ev.pointerPosition);
          },
          onToolDragMove(_, ev) {
            apagarParedeEm(ev.pointerPosition);
          }
        });

        await OBR.tool.createAction({
          id: `${NS}/acao-concluir`,
          icons: [
            {
              icon: ICONES.concluir,
              label: "Concluir (Gravar paredes)",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onClick() {
            concluirTracosPendentes();
          }
        });

        await OBR.tool.createAction({
          id: `${NS}/acao-desfazer`,
          icons: [
            {
              icon: ICONES.desfazer,
              label: "Desfazer",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onClick() {
            acaoDesfazer();
          }
        });

        await OBR.tool.createAction({
          id: `${NS}/acao-refazer`,
          icons: [
            {
              icon: ICONES.refazer,
              label: "Refazer",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onClick() {
            acaoRefazer();
          }
        });

        await OBR.tool.createAction({
          id: `${NS}/acao-cancelar`,
          icons: [
            {
              icon: ICONES.cancelar,
              label: "Cancelar Rascunho",
              filter: { activeTools: [`${NS}/tool-parede`] }
            }
          ],
          onClick() {
            cancelarRascunho();
          }
        });

        // 2. FERRAMENTA DE LUZ
        await OBR.tool.create({
          id: `${NS}/tool-luz`,
          icons: [{ icon: ICONES.luz, label: "Luz (Falloff)" }],
          defaultMode: `${NS}/modo-colocar-luz`
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-colocar-luz`,
          icons: [
            {
              icon: ICONES.luz,
              label: "Anexar Luz no Token",
              filter: { activeTools: [`${NS}/tool-luz`] }
            }
          ],
          onToolClick(_, ev) {
            aplicarLuzEmTokenAlvo(ev.target);
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-girar-cone`,
          icons: [
            {
              icon: ICONES.cone,
              label: "Apontar Feixe de Luz",
              filter: { activeTools: [`${NS}/tool-luz`] }
            }
          ],
          async onToolClick(_, ev) {
            const tokensComLuz = await OBR.scene.items.getItems((it) =>
              Boolean(it.metadata?.[META_LUZ_TOKEN])
            );
            if (tokensComLuz.length === 0) return;

            let maisProximo = tokensComLuz[0];
            let menor = distancia(tokensComLuz[0].position, ev.pointerPosition);
            for (const t of tokensComLuz) {
              const d = distancia(t.position, ev.pointerPosition);
              if (d < menor) {
                menor = d;
                maisProximo = t;
              }
            }
            const angGraus =
              (Math.atan2(
                ev.pointerPosition.y - maisProximo.position.y,
                ev.pointerPosition.x - maisProximo.position.x
              ) *
                180) /
                Math.PI -
              90;

            await OBR.scene.items.updateItems([maisProximo.id], (items) => {
              for (const item of items) {
                if (item.metadata[META_LUZ_TOKEN]) {
                  item.metadata[META_LUZ_TOKEN].rotacaoFeixe = angGraus;
                }
              }
            });
            await sincronizarLuzesLocais();
          }
        });

        await OBR.tool.createMode({
          id: `${NS}/modo-remover-luz`,
          icons: [
            {
              icon: ICONES.apagarLuz,
              label: "Remover Luz do Token",
              filter: { activeTools: [`${NS}/tool-luz`] }
            }
          ],
          onToolClick(_, ev) {
            removerLuzDeAlvoOuPonto(ev.pointerPosition, ev.target);
          }
        });
      }

      // ========================================================================
      // Comunicação com o Painel Popover
      // ========================================================================
      async function notificarEstadoPopover() {
        let qtdLuzes = 0;
        let nevoaPreenchida = false;
        let jogadoresSala = [];

        try {
          const party = await OBR.party.getPlayers();
          jogadoresSala = party.map((p) => ({ id: p.id, name: p.name, role: p.role }));
          jogadoresSala.unshift({ id: meuPlayerId, name: `${meuNome} (Você)`, role: souMestre ? "GM" : "PLAYER" });
        } catch {}

        if (cenaPronta) {
          try {
            const comLuz = await OBR.scene.items.getItems((it) => Boolean(it.metadata?.[META_LUZ_TOKEN]));
            qtdLuzes = comLuz.length;
            nevoaPreenchida = await OBR.scene.fog.getFilled();
          } catch {}
        }

        enviarMensagem({
          tipo: "ESTADO_CENA",
          estado: {
            cenaPronta,
            souMestre,
            meuPlayerId,
            jogadoresSala,
            paredesSalvas: paredesCena.length,
            portasSalvas: paredesCena.filter((w) => w.porta).length,
            tracosPendentes: tracosPendentes.length,
            luzesAtivas: qtdLuzes,
            celulasMemoria: celulasVisitadas.size,
            nevoaPreenchida
          }
        });
      }

      escutarMensagens(async (msg) => {
        if (!msg || !msg.tipo) return;

        switch (msg.tipo) {
          case "CONFIG_ATUALIZADA":
            config = msg.config || lerConfig();
            await reconstruirParedesLocais();
            await atualizarRascunhoEPrevia();
            await sincronizarLuzesLocais();
            if (config.memoriaAtiva) agendarAtualizacaoMemoria();
            else await renderizarMemoriaLocal([]);
            break;

          case "SOLICITAR_ESTADO":
            await notificarEstadoPopover();
            break;

          case "CONCLUIR_TRACOS":
            await concluirTracosPendentes();
            break;

          case "CANCELAR_TRACOS":
            await cancelarRascunho();
            break;

          case "DESFAZER":
            await acaoDesfazer();
            break;

          case "REFAZER":
            await acaoRefazer();
            break;

          case "LIMPAR_PAREDES":
            await cancelarRascunho();
            await salvarParedesNaCena([], true);
            await OBR.notification.show("Todas as paredes foram removidas da cena.", "INFO");
            break;

          case "IMPORTAR_PAREDES":
            if (Array.isArray(msg.paredes)) {
              await salvarParedesNaCena(msg.paredes, true);
              await OBR.notification.show(`${msg.paredes.length} parede(s) importada(s)!`, "SUCCESS");
            }
            break;

          case "EXPORTAR_PAREDES":
            enviarMensagem({ tipo: "DADOS_EXPORTACAO", paredes: paredesCena });
            break;

          case "APLICAR_LUZ_SELECIONADOS":
            await aplicarLuzNosSelecionados();
            break;

          case "LIMPAR_LUZES": {
            const comLuz = await OBR.scene.items.getItems((it) => Boolean(it.metadata?.[META_LUZ_TOKEN]));
            if (comLuz.length > 0) {
              await OBR.scene.items.updateItems(
                comLuz.map((i) => i.id),
                (items) => {
                  for (const item of items) delete item.metadata[META_LUZ_TOKEN];
                }
              );
            }
            // Também remove eventuais itens LIGHT antigos da cena
            const luzesAntigas = await OBR.scene.items.getItems((it) => it.type === "LIGHT");
            if (luzesAntigas.length > 0) {
              await OBR.scene.items.deleteItems(luzesAntigas.map((l) => l.id));
            }
            await sincronizarLuzesLocais();
            await OBR.notification.show("Todas as luzes foram removidas.", "INFO");
            notificarEstadoPopover();
            break;
          }

          case "ALTERNAR_NEVOA_CENA": {
            if (!cenaPronta) break;
            const atual = await OBR.scene.fog.getFilled();
            await OBR.scene.fog.setFilled(!atual);
            await OBR.notification.show(
              !atual ? "Névoa dinâmica ativada na cena!" : "Névoa da cena desativada.",
              "INFO"
            );
            notificarEstadoPopover();
            break;
          }

          case "REGISTRAR_MEMORIA_AGORA":
            await registrarPosicoesNaMemoria();
            await OBR.notification.show("Memória de névoa atualizada!", "SUCCESS");
            break;

          case "LIMPAR_MEMORIA_NEVOA":
            await limparMemoriaNevoa();
            break;
        }
      });

      // ========================================================================
      // Auto-vínculo: Quando um JOGADOR clica em um token com luz em modo "AUTO",
      // o token passa a ser exclusivamente daquele jogador!
      // ========================================================================
      async function verificarAutoVinculoJogador(player) {
        if (!cenaPronta || player.role === "GM") return;
        const selecao = player.selection || [];
        if (selecao.length === 0) return;

        const itensSelecionados = await OBR.scene.items.getItems(selecao);
        const paraVincular = itensSelecionados.filter(
          (it) => it.metadata?.[META_LUZ_TOKEN]?.donoId === "AUTO"
        );

        if (paraVincular.length > 0) {
          await OBR.scene.items.updateItems(
            paraVincular.map((i) => i.id),
            (items) => {
              for (const item of items) {
                if (item.metadata[META_LUZ_TOKEN]) {
                  item.metadata[META_LUZ_TOKEN].donoId = player.id;
                  item.metadata[META_LUZ_TOKEN].donoNome = player.name;
                }
              }
            }
          );
          await sincronizarLuzesLocais();
          if (config.memoriaAtiva) agendarAtualizacaoMemoria();
          await OBR.notification.show("Visão exclusiva deste token vinculada a você!", "SUCCESS");
        }
      }

      // ========================================================================
      // Inicialização na Cena
      // ========================================================================
      async function carregarCena() {
        cenaPronta = true;
        try {
          meuPlayerId = await OBR.player.getId();
          meuNome = await OBR.player.getName();
          souMestre = (await OBR.player.getRole()) === "GM";
          gridDpi = await OBR.scene.grid.getDpi();

          const meta = await OBR.scene.getMetadata();
          const lido = lerParedesDaCena(meta);
          paredesCena = lido.paredes;
          versaoAplicada = lido.versao;

          celulasVisitadas = lerMemoriaLocalJogador(meuPlayerId);

          await reconstruirParedesLocais();
          await atualizarRascunhoEPrevia();
          await sincronizarLuzesLocais();
          if (config.memoriaAtiva) {
            agendarAtualizacaoMemoria();
          }
          await notificarEstadoPopover();
        } catch (err) {
          console.error("[3em1] Erro ao carregar cena:", err);
        }
      }

      OBR.onReady(async () => {
        meuPlayerId = await OBR.player.getId();
        meuNome = await OBR.player.getName();
        souMestre = (await OBR.player.getRole()) === "GM";

        await registrarFerramentas();

        if (await OBR.scene.isReady()) {
          await carregarCena();
        }

        OBR.scene.onReadyChange(async (pronta) => {
          cenaPronta = pronta;
          if (pronta) {
            await carregarCena();
          } else {
            idsParedesLocais = [];
            idsRascunhoLocais = [];
            idsLuzesLocais = [];
            idsMemoriaLocais = [];
            notificarEstadoPopover();
          }
        });

        OBR.player.onChange(async (player) => {
          meuPlayerId = player.id;
          meuNome = player.name;
          const novoMestre = player.role === "GM";
          if (novoMestre !== souMestre) {
            souMestre = novoMestre;
            await reconstruirParedesLocais();
            await sincronizarLuzesLocais();
          }
          await verificarAutoVinculoJogador(player);
          notificarEstadoPopover();
        });

        OBR.party.onChange(() => {
          notificarEstadoPopover();
        });

        OBR.scene.grid.onChange((grid) => {
          gridDpi = grid.dpi || 150;
        });

        OBR.scene.onMetadataChange(async (meta) => {
          const lido = lerParedesDaCena(meta);
          if (lido.versao !== versaoAplicada) {
            versaoAplicada = lido.versao;
            paredesCena = lido.paredes;
            await reconstruirParedesLocais();
          }
          notificarEstadoPopover();
        });

        OBR.scene.items.onChange(async () => {
          await sincronizarLuzesLocais();
          if (config.memoriaAtiva) {
            agendarAtualizacaoMemoria();
          }
        });
      });
    </script>
