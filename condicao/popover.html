<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Condições do Token</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@owlbear-rodeo/sdk": "https://esm.sh/@owlbear-rodeo/sdk@3"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-title-wrap">
          <div id="tokenTitle" class="header-title">Condições</div>
          <div id="tokenSubtitle" class="header-subtitle">Carregando token...</div>
        </div>
        <div class="header-actions">
          <button id="btnClearAll" class="btn-danger btn-sm" title="Remover todas as condições">
            Limpar
          </button>
        </div>
      </header>

      <main class="scroll-area">
        <div id="conditionGrid" class="condition-grid"></div>
        <div id="exhaustionContainer"></div>
        <div id="activeRoundsContainer"></div>
      </main>

      <footer class="rule-footer">
        <div id="ruleTitle" class="rule-footer-title">Dica de Regras (D&D 5e)</div>
        <div id="ruleBody" class="rule-footer-body">
          Passe o mouse sobre uma condição para ler a regra resumida. Clique para ativar ou desativar.
        </div>
      </footer>
    </div>

    <script type="module" src="./js/popover.js"></script>
  </body>
</html>
