<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Forge</title>
<style>
:root{--bg:#17151f;--panel:#201d2b;--line:#352f47;--tx:#e8e4f2;--mut:#9a93b3;--ac:#d9a441;--acx:#1a1408}
@media (prefers-color-scheme:light){:root{--bg:#f3f0f8;--panel:#fff;--line:#d8d2e6;--tx:#25203a;--mut:#6d6585;--ac:#a8741a;--acx:#fff}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;padding:14px}
.app{display:grid;grid-template-columns:1fr 280px;gap:14px;max-width:820px;margin:0 auto}
@media (max-width:640px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h1{font:600 18px Georgia,serif;margin:0 0 12px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:12px}
.drop.on,.drop:hover{border-color:var(--ac);color:var(--tx)}
label{display:block;margin:10px 0 4px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
input[type=range]{flex:1;accent-color:var(--ac)}
output{width:44px;text-align:right;color:var(--mut)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--ac);outline-offset:2px}
.sw.none{background:repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/10px 10px}
input[type=text]{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
[hidden]{display:none!important}
button,select,.btn{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.primary{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;width:100%;padding:10px;margin-top:12px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.view{width:240px;height:240px;border-radius:8px;background:repeating-conic-gradient(#0003 0 25%,#0000 0 50%) 0 0/16px 16px,var(--bg);border:1px solid var(--line);touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:0}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <section class="panel" aria-label="Ajustes">
    <h1>Token Forge</h1>
    <div class="drop" id="drop" tabindex="0" role="button">Clique, arraste ou cole (Ctrl+V) uma imagem</div>
    <input type="file" id="file" accept="image/*" class="hide">

    <label for="zoom">Zoom</label>
    <div class="row"><input type="range" id="zoom" min="25" max="400" value="100"><output id="zoomO">100%</output></div>
    <label for="oy">Posição vertical (cima / baixo)</label>
    <div class="row"><input type="range" id="oy" min="-100" max="100" value="0"><output id="oyO">0</output></div>
    <label for="ox">Posição horizontal</label>
    <div class="row"><input type="range" id="ox" min="-100" max="100" value="0"><output id="oxO">0</output></div>

    <label>Borda</label>
    <div class="swatches" id="sws"></div>
    <div class="row" style="margin-top:10px">
      <input type="color" id="color" value="#d9a441" title="Cor personalizada" aria-label="Cor personalizada da borda">
      <span class="btn" id="customBtn">Borda PNG própria</span>
      <input type="file" id="borderFile" accept="image/png" class="hide">
    </div>
    <label for="bw">Espessura da borda</label>
    <div class="row"><input type="range" id="bw" min="0" max="60" value="22"><output id="bwO">22</output></div>
  </section>

  <section class="panel stage" aria-label="Resultado">
    <div class="view" id="view"><canvas id="cv" width="512" height="512"></canvas></div>
    <p class="hint">Arraste o token para reposicionar a imagem. A roda do mouse dá zoom.</p>
    <input type="text" id="name" placeholder="Nome do token" maxlength="60" aria-label="Nome do token" style="width:100%">
    <div class="row" style="width:100%">
      <select id="size" aria-label="Tamanho do arquivo" style="flex:1">
        <option value="256">256 px</option><option value="512" selected>512 px</option><option value="1024">1024 px</option>
      </select>
    </div>
    <button class="primary" id="send" hidden>Enviar para o Owlbear</button>
    <button class="primary" id="dl" style="margin-top:0">Baixar token</button>
    <p class="hint" id="msg" role="status"></p>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const S=512;
const BORDERS=[
  {n:'Ouro',s:['#fff1b8','#d9a441','#8a5a12','#e8c36a']},
  {n:'Prata',s:['#ffffff','#b8bfcc','#6b7280','#e5e9f0']},
  {n:'Bronze',s:['#f0c9a0','#b0733a','#5c3414','#d79a62']},
  {n:'Sangue',s:['#ff9a9a','#b3202a','#4d0a10','#d9434d']},
  {n:'Esmeralda',s:['#b6f5d2','#2e9e6b','#0f4a30','#5fcf9a']},
  {n:'Ônix',s:['#6a6a78','#2b2b35','#0b0b10','#4a4a58']}
];
const st={img:null,borderImg:null,zoom:1,ox:0,oy:0,bw:22,b:0,custom:null};

// seletores de borda
const sws=$('sws');
BORDERS.forEach((b,i)=>{
  const e=document.createElement('button');e.className='sw';e.title=b.n;e.setAttribute('aria-label','Borda '+b.n);
  e.style.background=`linear-gradient(135deg,${b.s[0]},${b.s[1]} 50%,${b.s[2]})`;
  e.onclick=()=>{st.b=i;st.custom=null;st.borderImg=null;sel();draw()};
  sws.appendChild(e);
});
const none=document.createElement('button');none.className='sw none';none.title='Sem borda';none.setAttribute('aria-label','Sem borda');
none.onclick=()=>{st.b=-1;st.custom=null;st.borderImg=null;sel();draw()};sws.appendChild(none);
function sel(){[...sws.children].forEach((e,i)=>e.setAttribute('aria-pressed',(i===st.b||(st.b===-1&&i===BORDERS.length))&&!st.custom&&!st.borderImg));}
sel();

// entrada de imagem
function loadImg(f,cb){if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>cb(i);i.src=u;}
const setMain=i=>{st.img=i;st.zoom=1;st.ox=0;st.oy=0;$('zoom').value=100;$('ox').value=0;$('oy').value=0;sync();draw()};
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>loadImg(e.target.files[0],setMain);
['dragover','dragenter'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('on')}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,()=>$('drop').classList.remove('on')));
$('drop').addEventListener('drop',e=>{e.preventDefault();loadImg(e.dataTransfer.files[0],setMain)});
addEventListener('paste',e=>{const f=[...e.clipboardData.files][0];loadImg(f,setMain)});

// borda personalizada
$('customBtn').onclick=()=>$('borderFile').click();
$('borderFile').onchange=e=>loadImg(e.target.files[0],i=>{st.borderImg=i;sel();draw()});
$('color').oninput=e=>{st.custom=e.target.value;st.borderImg=null;sel();draw()};

// controles
function sync(){
  $('zoomO').textContent=Math.round(st.zoom*100)+'%';$('oyO').textContent=Math.round(st.oy);
  $('oxO').textContent=Math.round(st.ox);$('bwO').textContent=st.bw;
}
$('zoom').oninput=e=>{st.zoom=e.target.value/100;sync();draw()};
$('oy').oninput=e=>{st.oy=+e.target.value;sync();draw()};
$('ox').oninput=e=>{st.ox=+e.target.value;sync();draw()};
$('bw').oninput=e=>{st.bw=+e.target.value;sync();draw()};

// arrastar e zoom na prévia
let drag=null;
const view=$('view');
view.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};view.setPointerCapture(e.pointerId)};
view.onpointermove=e=>{
  if(!drag)return;
  const k=100/view.clientWidth; // % da largura por pixel
  st.ox=clamp(drag.ox+(e.clientX-drag.x)*k,-100,100);st.oy=clamp(drag.oy+(e.clientY-drag.y)*k,-100,100);
  $('ox').value=st.ox;$('oy').value=st.oy;sync();draw();
};
view.onpointerup=view.onpointercancel=()=>drag=null;
view.onwheel=e=>{e.preventDefault();st.zoom=clamp(st.zoom*(e.deltaY<0?1.06:0.94),0.25,4);$('zoom').value=st.zoom*100;sync();draw()};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// desenho
function render(c,size){
  const g=c.getContext('2d'),k=size/S;
  g.clearRect(0,0,size,size);
  const R=size/2,bw=st.bw*k,inner=R-bw;
  if(st.img){
    const sc=Math.max(size/st.img.width,size/st.img.height)*st.zoom;
    const w=st.img.width*sc,h=st.img.height*sc;
    g.save();g.beginPath();g.arc(R,R,Math.max(inner,1),0,7);g.clip();
    g.drawImage(st.img,R-w/2+st.ox/100*size,R-h/2+st.oy/100*size,w,h);
    g.restore();
  }else{
    g.fillStyle='#8884';g.beginPath();g.arc(R,R,Math.max(inner,1),0,7);g.fill();
  }
  if(st.borderImg){g.drawImage(st.borderImg,0,0,size,size);return}
  if(bw<=0||st.b===-1&&!st.custom)return;
  const mid=R-bw/2;
  g.lineWidth=bw;g.beginPath();g.arc(R,R,mid,0,7);
  if(st.custom){g.strokeStyle=st.custom}
  else{
    const s=BORDERS[st.b].s,gr=g.createLinearGradient(0,0,size,size);
    gr.addColorStop(0,s[0]);gr.addColorStop(.35,s[1]);gr.addColorStop(.6,s[2]);gr.addColorStop(1,s[3]);
    g.strokeStyle=gr;
  }
  g.stroke();
  // filetes de acabamento
  g.lineWidth=Math.max(1,2*k);g.strokeStyle='#0006';
  g.beginPath();g.arc(R,R,R-g.lineWidth/2,0,7);g.stroke();
  g.beginPath();g.arc(R,R,inner+g.lineWidth/2,0,7);g.stroke();
}
function draw(){render(cv,S)}

function tokenBlob(){
  const size=+$('size').value,c=document.createElement('canvas');c.width=c.height=size;render(c,size);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
const tokenName=()=>$('name').value.trim()||'Token';
$('dl').onclick=async()=>{
  const b=await tokenBlob(),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=tokenName().replace(/[\\/:*?"<>|]/g,'')+'.png';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1e3);
};
sync();draw();
</script>
<script type="module">
import OBR, { buildImageUpload } from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
const $=id=>document.getElementById(id);
if(OBR.isAvailable){
  OBR.onReady(()=>{
    $('send').hidden=false;
    $('send').onclick=async()=>{
      const msg=$('msg');
      if(!st.img){msg.textContent='Adicione uma imagem antes de enviar.';return}
      try{
        const name=tokenName(),blob=await tokenBlob();
        // o Owlbear exige um File novo criado a partir dos bytes
        const file=new File([await blob.arrayBuffer()],name+'.png',{type:'image/png'});
        const upload=buildImageUpload(file).name(name).build();
        msg.textContent='Escolha a pasta no seletor do Owlbear.';
        await OBR.assets.uploadImages([upload],'CHARACTER');
        msg.textContent='Token "'+name+'" enviado.';
      }catch(e){msg.textContent='Envio cancelado ou falhou: '+(e&&e.message||e)}
    };
  });
}
</script>
</body>
</html>
