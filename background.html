<!doctype html>
<html><head><meta charset="utf-8"><title>Bard's Hall - motor de áudio</title>
</head><body>
<div id="players" style="position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden"></div>
<script type="module">
let OBR;
for (const u of ["https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm", "https://esm.sh/@owlbear-rodeo/sdk@3"]) {
  try { OBR = (await import(u)).default; break; } catch (e) {}
}
const NS = "com.gaduart.mesa-de-som";
const players = {};
let ytReady = false, meta = null;

// Volume geral: escolha de cada pessoa, só neste dispositivo (0-100%).
let master = 100;
try { const v = localStorage.getItem("bh-master"); if (v !== null) master = Math.min(100, Math.max(0, +v || 0)); } catch (e) {}
const eff = v => Math.round((v || 0) * master / 100);
function setMaster(m) {
  master = Math.min(100, Math.max(0, +m || 0));
  for (const id in players) { try { players[id].p.setVolume(eff(players[id].vol)); } catch (e) {} }
}
addEventListener("storage", e => { if (e.key === "bh-master") setMaster(e.newValue); });
try { new BroadcastChannel("bh-master").onmessage = e => setMaster(e.data); } catch (e) {}

window.onYouTubeIframeAPIReady = () => { ytReady = true; sync(); };
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);

OBR.onReady(async () => {
  // A biblioteca nasce vazia toda vez que o mestre recarrega a página.
  if ((await OBR.player.getRole()) === "GM") {
    await OBR.room.setMetadata({ [NS + "/lib"]: { folders: [] }, [NS + "/state"]: { playing: {} } });
  }
  meta = await OBR.room.getMetadata();
  sync();
  OBR.room.onMetadataChange(m => { meta = m; sync(); });
});

function sync() {
  if (!ytReady || !meta) return;
  const lib = meta[NS + "/lib"] || { folders: [] };
  const playing = (meta[NS + "/state"] || {}).playing || {};
  const tracks = {};
  lib.folders.forEach(f => f.tracks.forEach(t => tracks[t.id] = t));

  for (const id in players) {
    if (!playing[id] || !tracks[id] || players[id].vid !== tracks[id].vid) {
      try { players[id].p.destroy(); } catch (e) {}
      players[id].el.remove();
      delete players[id];
    }
  }
  for (const id in playing) {
    const t = tracks[id];
    if (!t) continue;
    if (!players[id]) create(id, t);
    else {
      players[id].loop = t.loop;
      players[id].vol = t.vol;
      try { players[id].p.setVolume(eff(t.vol)); } catch (e) {}
    }
  }
}

function create(id, t) {
  const el = document.createElement("div");
  document.getElementById("players").appendChild(el);
  const entry = { vid: t.vid, loop: t.loop, vol: t.vol, el, p: null };
  players[id] = entry;
  entry.p = new YT.Player(el, {
    width: "1", height: "1", videoId: t.vid,
    playerVars: { autoplay: 1, controls: 0, playsinline: 1 },
    events: {
      onReady: e => { e.target.setVolume(eff(entry.vol)); e.target.playVideo(); },
      onStateChange: e => { if (e.data === 0 && entry.loop) e.target.playVideo(); }
    }
  });
}
</script></body></html>
