<!doctype html>
<html><head><meta charset="utf-8"><title>Warpath - câmera dos jogadores</title></head><body>
<script type="module">
let OBR, sdkErr;
for (const u of ["https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm", "https://esm.sh/@owlbear-rodeo/sdk@3"]) {
  try { OBR = (await import(u)).default; break; } catch (e) { sdkErr = e; }
}
if (!OBR) throw sdkErr;

const tries = (() => { try { return +sessionStorage.getItem("wp-bg-tries") || 0; } catch (e) { return 0; } })();
const dog = setTimeout(() => {
  if (tries < 3) { try { sessionStorage.setItem("wp-bg-tries", tries + 1); } catch (e) {} location.reload(); }
}, 15000);

const SKEY = "com.gaduart.warpath/state";
let lastKey = null;
const follows = () => { try { return localStorage.getItem("wp-follow") !== "0"; } catch (e) { return true; } };
const turnKey = s => (s && s.active && s.started && s.turnId) ? `${s.since || 0}:${s.round || 1}:${s.turnId}` : null;

async function focus(id) {
  if (!id || !(await OBR.scene.isReady())) return;
  let c, b;
  try {
    b = await OBR.scene.items.getItemBounds([id]);
    c = b?.center;
  } catch (e) {}
  if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.y)) {
    const [it] = await OBR.scene.items.getItems([id]);
    if (!it) return;
    c = it.position;
    b = { min: c, max: c, width: 0, height: 0, center: c };
  }
  try {
    const [width, height, curScale, dpi] = await Promise.all([
      OBR.viewport.getWidth(),
      OBR.viewport.getHeight(),
      OBR.viewport.getScale(),
      OBR.scene.grid.getDpi().catch(() => 150)
    ]);
    const gridDpi = dpi || 150;
    const minScale = Math.min(width, height) / (gridDpi * 14);
    const maxScale = Math.min(width, height) / (gridDpi * 4);
    const scale = Math.max(minScale, Math.min(maxScale, curScale || 1));
    await OBR.viewport.animateTo({
      position: { x: -c.x * scale + width / 2, y: -c.y * scale + height / 2 },
      scale
    });
  } catch (e) {
    const dpi = (await OBR.scene.grid.getDpi().catch(() => 150)) || 150;
    const r = Math.max(dpi * 3, b?.width || 0, b?.height || 0);
    await OBR.viewport.animateToBounds({ min: { x: c.x - r, y: c.y - r }, max: { x: c.x + r, y: c.y + r }, width: 2 * r, height: 2 * r, center: c });
  }
}

async function handle(s) {
  const key = turnKey(s);
  if (!key) { lastKey = null; return; }
  if (key === lastKey) return;
  lastKey = key;
  try {
    if (sessionStorage.getItem("wp-last-turn") === key) return;
    sessionStorage.setItem("wp-last-turn", key);
  } catch (e) {}
  if (!follows()) return;
  try { await focus(s.turnId); } catch (e) {}
}

OBR.onReady(async () => {
  clearTimeout(dog); try { sessionStorage.removeItem("wp-bg-tries"); } catch (e) {}
  const cur = (await OBR.room.getMetadata())[SKEY];
  lastKey = turnKey(cur); // ao entrar na sala, não puxa a câmera de imediato
  if (lastKey) { try { sessionStorage.setItem("wp-last-turn", lastKey); } catch (e) {} }
  OBR.room.onMetadataChange(m => handle(m[SKEY]));
  setInterval(async () => { try { handle((await OBR.room.getMetadata())[SKEY]); } catch (e) {} }, 2500);
});
</script></body></html>
